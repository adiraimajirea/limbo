name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The repo's .gitignore excludes jniLibs/, so fetch the native libs during the build
      - name: Fetch native libs
        run: sh ./fetch-native-libs.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      # Use the SDK already installed on the runner
      - name: Install SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-29" "build-tools;29.0.3"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.0.2

      - name: Build debug APK
        run: gradle :limbo-android-x86:assembleDebug --no-daemon

      - name: Check native libs and BIOS are in the APK
        run: |
          APK=$(ls limbo-android-x86/build/outputs/apk/debug/*.apk)
          unzip -l "$APK" | grep -c "libcompat-limbo.so"
          unzip -l "$APK" | grep -c "assets/roms/bios-256k.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: limbo-shared-folder-apk
          path: limbo-android-x86/build/outputs/apk/debug/*.apk
